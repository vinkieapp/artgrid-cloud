<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Artgrid Cloud</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="scene" id="scene">

    <div class="sky"></div>
    <div class="sun-glow"></div>


    <!-- 1. CHICHEN ITZA -->

    <div
      class="wonder"
      id="chichen"
      data-depth="0.65"
    >

      <img
        src="chichen-itza.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 2. COLOSSEUM -->

    <div
      class="wonder"
      id="colosseum"
      data-depth="0.85"
    >

      <img
        src="colosseum.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 3. PETRA -->

    <div
      class="wonder"
      id="petra"
      data-depth="0.55"
    >

      <img
        src="petra.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 4. TAJ MAHAL -->

    <div
      class="wonder"
      id="taj"
      data-depth="1"
    >

      <img
        src="taj-mahal.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 5. CHRIST THE REDEEMER -->

    <div
      class="wonder"
      id="christ"
      data-depth="0.75"
    >

      <img
        src="christ-redeemer.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 6. MACHU PICCHU -->

    <div
      class="wonder"
      id="machu"
      data-depth="0.45"
    >

      <img
        src="machu-picchu.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- 7. GREAT WALL -->

    <div
      class="wonder"
      id="greatwall"
      data-depth="0.9"
    >

      <img
        src="great-wall.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- CLOUDS -->

    <div class="cloud cloud-back-1"></div>
    <div class="cloud cloud-back-2"></div>
    <div class="cloud cloud-front-1"></div>
    <div class="cloud cloud-front-2"></div>

    <div class="atmosphere"></div>

  </main>


  <script src="animation.js"></script>

</body>

</html>
