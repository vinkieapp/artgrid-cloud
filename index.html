<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seven Wonders</title>

  <!-- v5 forces the browser to load the newest CSS -->
  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

  <div class="scene" id="scene">

    <div class="sky"></div>
    <div class="sun"></div>
    <div class="clouds-bg"></div>


    <!-- CHICHEN ITZA -->

    <div class="wonder" id="chichen">
      <img
        src="chichen-itza.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- COLOSSEUM -->

    <div class="wonder" id="colosseum">
      <img
        src="colosseum.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- PETRA -->

    <div class="wonder" id="petra">
      <img
        src="petra.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- TAJ MAHAL -->

    <div class="wonder" id="taj">
      <img
        src="taj-mahal.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- CHRIST THE REDEEMER -->

    <div class="wonder" id="christ">
      <img
        src="christ-redeemer.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- MACHU PICCHU -->

    <div class="wonder" id="machu">
      <img
        src="machu-picchu.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>


    <!-- GREAT WALL OF CHINA -->

    <div class="wonder" id="greatwall">
      <img
        src="great-wall.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >
    </div>

  </div>


  <!-- v5 forces the browser to load newest JS -->
  <script src="animation.js?v=5"></script>

</body>

</html>
