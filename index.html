<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seven Wonders</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="scene" id="scene">

    <div class="sky"></div>
    <div class="sun"></div>
    <div class="clouds-bg"></div>


    <!-- CHICHEN ITZA -->

    <div
      class="wonder"
      id="chichen"
      data-speed="0.15"
    >

      <img
        src="chichen-itza.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- COLOSSEUM -->

    <div
      class="wonder"
      id="colosseum"
      data-speed="0.25"
    >

      <img
        src="colosseum.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- PETRA -->

    <div
      class="wonder"
      id="petra"
      data-speed="0.18"
    >

      <img
        src="petra.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- TAJ MAHAL -->

    <div
      class="wonder"
      id="taj"
      data-speed="0.22"
    >

      <img
        src="taj-mahal.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- CHRIST THE REDEEMER -->

    <div
      class="wonder"
      id="christ"
      data-speed="0.12"
    >

      <img
        src="christ-redeemer.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- MACHU PICCHU -->

    <div
      class="wonder"
      id="machu"
      data-speed="0.16"
    >

      <img
        src="machu-picchu.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>


    <!-- GREAT WALL OF CHINA -->

    <div
      class="wonder"
      id="greatwall"
      data-speed="0.20"
    >

      <img
        src="great-wall.PNG"
        alt=""
        onerror="this.parentElement.style.display='none'"
      >

    </div>

  </div>


  <script src="animation.js"></script>

</body>

</html>
